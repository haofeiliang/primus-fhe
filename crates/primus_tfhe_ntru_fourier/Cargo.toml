[package]
name = "primus_tfhe_ntru_fourier"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_encoding = { path = "../primus_encoding" }
primus_decompose = { path = "../primus_decompose" }
primus_data = { path = "../primus_data" }
primus_fft = { path = "../primus_fft" }
primus_integer = { path = "../primus_integer" }
primus_lattice = { path = "../primus_lattice" }
primus_modulus = { path = "../primus_modulus" }
primus_ntru = { path = "../primus_ntru" }
primus_reduce = { path = "../primus_reduce" }
primus_poly = { path = "../primus_poly" }
primus_tfhe = { path = "../primus_tfhe" }
primus_tfhe_ntru = { path = "../primus_tfhe_ntru" }

num-traits = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
primus_test_allocations = { path = "../../test-support/allocations" }
primus_tfhe_test_support = { path = "../../test-support/tfhe" }
criterion = { workspace = true }
primus_lwe = { path = "../primus_lwe" }

[[bench]]
name = "pbs"
harness = false

[[bench]]
name = "circuit_bootstrap"
harness = false

[[bench]]
name = "mvb"
harness = false

[features]
default = []
simd = [
    "primus_integer/simd",
    "primus_lattice/simd",
    "primus_ntru/simd",
    "primus_tfhe_ntru/simd",
]
