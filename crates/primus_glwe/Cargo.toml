[package]
name = "primus_glwe"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_data = { path = "../primus_data", features = ["aligned-vec"] }
primus_decompose = { path = "../primus_decompose" }
primus_distr = { path = "../primus_distr" }
primus_factor = { path = "../primus_factor" }
primus_fft = { path = "../primus_fft" }
primus_encoding = { path = "../primus_encoding" }
primus_integer = { path = "../primus_integer" }
primus_lattice = { path = "../primus_lattice" }
primus_lwe = { path = "../primus_lwe" }
primus_modulus = { path = "../primus_modulus" }
primus_ntt = { path = "../primus_ntt" }
primus_poly = { path = "../primus_poly" }
primus_reduce = { path = "../primus_reduce" }

aligned-vec = "0.6.4"
num-traits = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "encryption"
harness = false
required-features = ["rustfft"]

[[bench]]
name = "primitives"
harness = false
required-features = ["rustfft", "tfhe-fft"]

[[bench]]
name = "key_conversion"
harness = false
required-features = ["rustfft"]

# Targets instantiate these FFT engines explicitly; generic library APIs need neither.
[[test]]
name = "automorphism"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "boundaries"
required-features = ["rustfft"]

[[test]]
name = "cmux"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "constant_gadget"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "fourier_glwe_secret_key"
required-features = ["rustfft"]

[[test]]
name = "gadget_generation"
required-features = ["rustfft"]

[[test]]
name = "glwe_key_switch"
required-features = ["rustfft"]

[[test]]
name = "packing_key_switch"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "scheme_switch"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "trace_packing"
required-features = ["rustfft", "tfhe-fft"]

[features]
default = []
rustfft = ["primus_fft/rustfft"]
tfhe-fft = ["primus_fft/tfhe-fft"]
simd = [
    "primus_encoding/simd",
    "primus_factor/simd",
    "primus_integer/simd",
    "primus_modulus/simd",
    "primus_poly/simd",
    "primus_ntt/simd",
    "primus_decompose/simd",
    "primus_lattice/simd",
    "primus_lwe/simd",
]
