[package]
name = "primus_tfhe_glwe_fourier"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_encoding = { path = "../primus_encoding" }
primus_data = { path = "../primus_data" }
primus_decompose = { path = "../primus_decompose" }
primus_fft = { path = "../primus_fft" }
primus_glwe = { path = "../primus_glwe" }
primus_lattice = { path = "../primus_lattice" }
primus_lwe = { path = "../primus_lwe" }
primus_modulus = { path = "../primus_modulus" }
primus_poly = { path = "../primus_poly" }
primus_reduce = { path = "../primus_reduce" }
primus_tfhe = { path = "../primus_tfhe" }
primus_tfhe_glwe = { path = "../primus_tfhe_glwe" }

rand = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
primus_test_allocations = { path = "../../test-support/allocations" }
primus_tfhe_test_support = { path = "../../test-support/tfhe" }
criterion = { workspace = true }

[[bench]]
name = "pbs"
harness = false

[[bench]]
name = "ternary_pbs"
harness = false

[[bench]]
name = "circuit_bootstrap"
harness = false

[[bench]]
name = "sparse_pbs"
harness = false

[[bench]]
name = "mvb"
harness = false

[features]
default = []
simd = [
    "primus_glwe/simd",
    "primus_lattice/simd",
    "primus_lwe/simd",
    "primus_modulus/simd",
    "primus_tfhe/simd",
    "primus_tfhe_glwe/simd",
]
