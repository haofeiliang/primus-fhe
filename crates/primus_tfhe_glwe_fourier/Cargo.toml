[package]
name = "primus_tfhe_glwe_fourier"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_encoding = { path = "../primus_encoding" }
primus_data = { path = "../primus_data" }
primus_decompose = { path = "../primus_decompose" }
primus_fft = { path = "../primus_fft" }
primus_glwe = { path = "../primus_glwe", features = ["fourier"] }
primus_lattice = { path = "../primus_lattice", features = ["fourier"] }
primus_lwe = { path = "../primus_lwe" }
primus_modulus = { path = "../primus_modulus" }
primus_poly = { path = "../primus_poly" }
primus_reduce = { path = "../primus_reduce" }
primus_tfhe = { path = "../primus_tfhe" }
primus_tfhe_glwe = { path = "../primus_tfhe_glwe" }

rand = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
primus_integer = { path = "../primus_integer" }

# Examples and engine-specific tests select their concrete FFT engines.
[[example]]
name = "fourier_basic"
required-features = ["rustfft"]

[[example]]
name = "fourier_circuit_bootstrap"
required-features = ["rustfft"]

[[example]]
name = "fourier_mvb_thresholds"
required-features = ["rustfft"]

[[example]]
name = "fourier_sparse"
required-features = ["rustfft"]

[[example]]
name = "fourier_sparse_circuit_bootstrap"
required-features = ["rustfft"]

[[test]]
name = "blind_rotation"
required-features = ["rustfft"]

[[test]]
name = "boolean"
required-features = ["rustfft"]

[[test]]
name = "circuit_bootstrap"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "context"
required-features = ["rustfft"]

[[test]]
name = "factorized_pbs"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "pbs"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "sparse_blind_rotation"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "sparse_key"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "sparse_pbs"
required-features = ["rustfft", "tfhe-fft"]

[features]
default = []
rustfft = ["primus_fft/rustfft"]
tfhe-fft = ["primus_fft/tfhe-fft"]
simd = [
    "primus_glwe/simd",
    "primus_lattice/simd",
    "primus_lwe/simd",
    "primus_modulus/simd",
    "primus_tfhe/simd",
    "primus_tfhe_glwe/simd",
]
