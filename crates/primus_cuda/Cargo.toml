[package]
name = "primus_cuda"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = [
    "dep:cudarc",
    "dep:primus_decompose",
    "dep:primus_integer",
    "dep:primus_lattice",
    "dep:primus_modulus",
    "dep:primus_ntt",
    "dep:primus_tfhe_glwe",
    "dep:thiserror",
]

[dependencies]
cudarc = { version = "=0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"], optional = true }
primus_decompose = { path = "../primus_decompose", optional = true }
primus_integer = { path = "../primus_integer", optional = true }
primus_lattice = { path = "../primus_lattice", optional = true }
primus_modulus = { path = "../primus_modulus", optional = true }
primus_ntt = { path = "../primus_ntt", optional = true }
primus_tfhe_glwe = { path = "../primus_tfhe_glwe", optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
primus_encoding = { path = "../primus_encoding" }
primus_glwe = { path = "../primus_glwe", features = ["ntt"] }
primus_lwe = { path = "../primus_lwe" }
primus_poly = { path = "../primus_poly" }
primus_shape = { path = "../primus_shape" }
primus_tfhe = { path = "../primus_tfhe" }
primus_tfhe_glwe_ntt = { path = "../primus_tfhe_glwe_ntt" }
rand = { workspace = true }

[[example]]
name = "cuda_smoke"
required-features = ["cuda"]

[[test]]
name = "device"
required-features = ["cuda"]

[[test]]
name = "external_product"
required-features = ["cuda"]

[[test]]
name = "block_rotation"
required-features = ["cuda"]

[[test]]
name = "blind_rotation"
required-features = ["cuda"]
