[package]
name = "primus_tfhe"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_integer = { path = "../primus_integer" }
primus_reduce = { path = "../primus_reduce" }
primus_poly = { path = "../primus_poly" }
primus_encoding = { path = "../primus_encoding" }
primus_lwe = { path = "../primus_lwe" }

thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
primus_modulus = { path = "../primus_modulus" }

[[bench]]
name = "lookup_table"
harness = false

[features]
default = []
simd = [
    "primus_encoding/simd",
    "primus_integer/simd",
    "primus_lwe/simd",
]
