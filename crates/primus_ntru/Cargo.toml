[package]
name = "primus_ntru"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_data = { path = "../primus_data" }
primus_decompose = { path = "../primus_decompose" }
primus_distr = { path = "../primus_distr" }
primus_fft = { path = "../primus_fft" }
primus_encoding = { path = "../primus_encoding" }
primus_factor = { path = "../primus_factor" }
primus_integer = { path = "../primus_integer" }
primus_lattice = { path = "../primus_lattice" }
primus_lwe = { path = "../primus_lwe" }
primus_modulus = { path = "../primus_modulus" }
primus_ntt = { path = "../primus_ntt" }
primus_poly = { path = "../primus_poly" }
primus_reduce = { path = "../primus_reduce" }

num-traits = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
primus_test_allocations = { path = "../../test-support/allocations" }
criterion = { workspace = true }

[[bench]]
name = "constant_gadget"
harness = false
required-features = ["rustfft"]

[[bench]]
name = "primitives"
harness = false
required-features = ["rustfft", "tfhe-fft"]

[[bench]]
name = "ternary_cmux"
harness = false
required-features = ["rustfft", "tfhe-fft"]

[[bench]]
name = "encryption"
harness = false
required-features = ["rustfft", "tfhe-fft"]

[[bench]]
name = "lwe_return"
harness = false

# Targets instantiate these FFT engines explicitly; generic library APIs need neither.
[[test]]
name = "automorphism"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "constant_gadget"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "gadget_generation"
required-features = ["rustfft"]

[[test]]
name = "key_switch"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "lwe_key_switch"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "padded_secret_key"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "phase_contracts"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "scheme_switch"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "secret_key"
required-features = ["rustfft"]

[[test]]
name = "ternary_cmux"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "trace"
required-features = ["rustfft", "tfhe-fft"]

[[test]]
name = "zeroize"
required-features = ["rustfft"]

[features]
default = []
rustfft = ["primus_fft/rustfft"]
tfhe-fft = ["primus_fft/tfhe-fft"]
simd = [
    "primus_integer/simd",
    "primus_factor/simd",
    "primus_lattice/simd",
    "primus_lwe/simd",
    "primus_ntt/simd",
    "primus_poly/simd",
]
