[package]
name = "primus_fhe_core"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_data = { path = "../primus_data" }
primus_gcd = { path = "../primus_gcd" }
primus_integer = { path = "../primus_integer" }
primus_reduce = { path = "../primus_reduce" }
primus_modulo = { path = "../primus_modulo" }
primus_modulus = { path = "../primus_modulus" }
primus_factor = { path = "../primus_factor" }
primus_distr = { path = "../primus_distr" }
primus_poly = { path = "../primus_poly" }
primus_ntt = { path = "../primus_ntt" }
primus_rns = { path = "../primus_rns" }
primus_decompose = { path = "../primus_decompose" }
primus_lattice = { path = "../primus_lattice" }
primus_fft = { path = "../primus_fft" }

rayon = { workspace = true }

thiserror = { workspace = true }
rand = { workspace = true }
itertools = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
[[bench]]
name = "lwe_enc"
harness = false

[[bench]]
name = "plaintext_codec"
harness = false

[[bench]]
name = "automorphism"
harness = false

[[bench]]
name = "trace"
harness = false

[[bench]]
name = "expand_coeff"
harness = false

[[bench]]
name = "expand_coeff_components"
harness = false

[features]
default = []
simd = [
    "primus_integer/simd",
    "primus_modulus/simd",
    "primus_factor/simd",
    "primus_poly/simd",
    "primus_ntt/simd",
    "primus_rns/simd",
    "primus_decompose/simd",
    "primus_lattice/simd",
]
