[package]
name = "primus_tfhe_ntru_lut"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { workspace = true }
primus_decompose = { path = "../primus_decompose", optional = true }
primus_encoding = { path = "../primus_encoding" }
primus_fft = { path = "../primus_fft", optional = true }
primus_integer = { path = "../primus_integer" }
primus_lattice = { path = "../primus_lattice", optional = true }
primus_modulus = { path = "../primus_modulus", optional = true }
primus_ntru = { path = "../primus_ntru", optional = true }
primus_ntt = { path = "../primus_ntt", optional = true }
primus_poly = { path = "../primus_poly" }
primus_reduce = { path = "../primus_reduce" }
primus_tfhe = { path = "../primus_tfhe", optional = true }
primus_tfhe_ntru = { path = "../primus_tfhe_ntru", optional = true }
primus_tfhe_ntru_ntt = { path = "../primus_tfhe_ntru_ntt", optional = true }
primus_tfhe_ntru_fourier = { path = "../primus_tfhe_ntru_fourier", optional = true }
rand = { workspace = true, optional = true }
thiserror = { workspace = true }

# Examples select one backend explicitly.
[[example]]
name = "ntt_lookup"
required-features = ["ntt"]

[[example]]
name = "fourier_lookup"
required-features = ["rustfft"]

[features]
default = ["ntt", "fourier"]
ntt = [
    "dep:primus_decompose",
    "dep:rand",
    "dep:primus_modulus",
    "dep:primus_tfhe",
    "dep:primus_tfhe_ntru",
    "dep:primus_ntt",
    "dep:primus_tfhe_ntru_ntt",
    "primus_lattice/ntt",
    "primus_ntru/ntt",
]
fourier = [
    "dep:primus_decompose",
    "dep:rand",
    "dep:primus_modulus",
    "dep:primus_tfhe",
    "dep:primus_tfhe_ntru",
    "dep:primus_fft",
    "dep:primus_tfhe_ntru_fourier",
    "primus_lattice/fourier",
    "primus_ntru/fourier",
]
rustfft = ["fourier", "primus_fft/rustfft"]
tfhe-fft = ["fourier", "primus_fft/tfhe-fft"]
simd = [
    "primus_decompose?/simd",
    "primus_encoding/simd",
    "primus_poly/simd",
    "primus_tfhe_ntru?/simd",
    "primus_tfhe_ntru_ntt?/simd",
    "primus_tfhe_ntru_fourier?/simd",
]
